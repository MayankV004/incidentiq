name: IncidentIQ CI

on:
  push:
    branches: [main, master, fix/*]
  pull_request:
    branches: [main, master]

jobs:
  python:
    name: Python Lint, Types, Tests & Evals
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Python dependencies from lockfile
        run: uv sync --frozen

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Full MyPy Type Check
        run: uv run mypy .

      - name: Verify README Benchmark Tables Match JSON Artifacts
        run: uv run python scripts/update_readme_results.py --check

      - name: Run Pytest Unit & Contract Test Suite
        run: uv run pytest

      - name: Run Red-Team Adversarial Suite
        run: uv run python evals/redteam/run_redteam.py

      - name: Run IncidentBench Replay Evaluation with Thresholds Gate
        env:
          APPROVAL_TOKEN_SECRET: ci-replay-eval-approval-secret
          API_KEY: ci-replay-eval-api-key
        run: PYTHONPATH=. uv run python evals/run_evals.py --name ci-eval

  ui:
    name: UI Lint & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install UI dependencies from lockfile
        working-directory: ui
        run: CI=true pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ui
        run: pnpm lint

      - name: Run TypeScript TypeCheck
        working-directory: ui
        run: ./node_modules/.bin/tsc --noEmit
