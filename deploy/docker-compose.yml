version: "3.8"

services:
  # Caddy Production Reverse Proxy (Only public ingress on ports 80 & 443)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - incidentiq-api
      - ui

  # Target Simulated Shop Microservices (Internal only)
  fake-external:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install fastapi uvicorn pydantic structlog prometheus-client psutil
        CMD ["uvicorn", "shop.fake_external.main:app", "--host", "0.0.0.0", "--port", "8004"]
    expose:
      - "8004"

  payments:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install fastapi uvicorn pydantic httpx structlog prometheus-client psutil
        CMD ["uvicorn", "shop.payments.main:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      - FAKE_EXTERNAL_URL=http://fake-external:8004
    expose:
      - "8003"
    depends_on:
      - fake-external

  orders:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install fastapi uvicorn pydantic structlog prometheus-client psutil
        CMD ["uvicorn", "shop.orders.main:app", "--host", "0.0.0.0", "--port", "8002"]
    expose:
      - "8002"

  gateway:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install fastapi uvicorn pydantic httpx structlog prometheus-client psutil
        CMD ["uvicorn", "shop.gateway.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      - ORDERS_SERVICE_URL=http://orders:8002
      - PAYMENTS_SERVICE_URL=http://payments:8003
    expose:
      - "8001"
    depends_on:
      - orders
      - payments

  # FastMCP Microservices (Internal only)
  mcp-metrics:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install mcp uvicorn pydantic httpx structlog prometheus-client
        CMD ["uvicorn", "mcp_servers.metrics.server:app", "--host", "0.0.0.0", "--port", "9101"]
    expose:
      - "9101"

  mcp-logs:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install mcp uvicorn pydantic structlog
        CMD ["uvicorn", "mcp_servers.logs.server:app", "--host", "0.0.0.0", "--port", "9102"]
    expose:
      - "9102"

  mcp-remediation:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install mcp uvicorn pydantic structlog
        CMD ["uvicorn", "mcp_servers.remediation.server:app", "--host", "0.0.0.0", "--port", "9103"]
    expose:
      - "9103"

  # IncidentIQ Control Plane API (Internal only, proxied via Caddy)
  incidentiq-api:
    build:
      context: ..
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install fastapi uvicorn pydantic langgraph mcp scikit-learn structlog prometheus-client httpx
        CMD ["uvicorn", "incidentiq.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DATA_MODE=replay
      - SCENARIO_ID=001_orders_db_pool_exhaustion
      - MCP_MODE=http
      - MCP_METRICS_URL=http://mcp-metrics:9101/mcp
      - MCP_LOGS_URL=http://mcp-logs:9102/mcp
      - MCP_REMEDIATION_URL=http://mcp-remediation:9103/mcp
    expose:
      - "8000"
    depends_on:
      - gateway
      - mcp-metrics
      - mcp-logs
      - mcp-remediation

  # IncidentIQ Web UI (Internal only, proxied via Caddy)
  ui:
    build:
      context: ../ui
      dockerfile_inline: |
        FROM node:20-alpine
        WORKDIR /app
        COPY package.json pnpm-lock.yaml* ./
        RUN npm install -g pnpm && pnpm install
        COPY . .
        RUN pnpm build
        CMD ["pnpm", "start", "-p", "3000"]
    environment:
      - NEXT_PUBLIC_API_URL=/v1
    expose:
      - "3000"
    depends_on:
      - incidentiq-api

volumes:
  caddy_data:
  caddy_config:
